# Confluence Confluence Optimizer - Forge manifest
#
# Before the first deploy run `forge register` (it writes a fresh app.id below),
# then `forge deploy` and `forge install`. See docs/INSTALL.md.

app:
  id: ari:cloud:ecosystem::app/67181e6f-815e-4b25-bf20-28cba9a8a721
  runtime:
    name: nodejs22.x

modules:
  # ---------------------------------------------------------------- UI
  # Site-wide console. Only Confluence administrators can open global settings,
  # and every resolver call re-checks admin permission on the server.
  confluence:globalSettings:
    - key: coam-admin
      title: Confluence Optimizer
      resource: admin-ui
      render: native
      resolver:
        function: admin-resolver

  # Space-level view for space admins (Space settings > Integrations).
  confluence:spaceSettings:
    - key: coam-space
      title: Storage cleanup
      route: storage-cleanup
      resource: space-ui
      render: native
      resolver:
        function: space-resolver

  # ---------------------------------------------------------------- storage
  sql:
    - key: main
      engine: mysql

  # ---------------------------------------------------------------- async work
  consumer:
    - key: scan-consumer
      queue: coam-scan
      function: scan-worker
    - key: exec-consumer
      queue: coam-exec
      function: exec-worker
    - key: migrate-consumer
      queue: coam-migrate
      function: migrate-worker

  trigger:
    - key: lifecycle-trigger
      function: lifecycle
      events:
        - avi:forge:installed:app
        - avi:forge:upgraded:app

  scheduledTrigger:
    - key: daily-housekeeping
      function: daily
      interval: day

  function:
    - key: admin-resolver
      handler: index.adminResolver
    - key: space-resolver
      handler: index.spaceResolver
    - key: scan-worker
      handler: index.scanWorker
      timeoutSeconds: 900
    - key: exec-worker
      handler: index.execWorker
      timeoutSeconds: 900
    - key: migrate-worker
      handler: index.migrateWorker
      timeoutSeconds: 900
    - key: lifecycle
      handler: index.lifecycle
    - key: daily
      handler: index.daily

resources:
  - key: admin-ui
    path: src/frontend/admin/index.jsx
  - key: space-ui
    path: src/frontend/space/index.jsx

permissions:
  scopes:
    # Key-value store for settings and scan state
    - storage:app
    # Read site structure and attachment metadata (REST v2)
    - read:space:confluence
    - read:page:confluence
    - read:attachment:confluence
    # Reviewed cleanup actions (only ever executed after approval)
    - delete:attachment:confluence # move attachment to trash / purge from trash
    - delete:page:confluence # purge trashed pages from the space trash
    - delete:blogpost:confluence # purge trashed blog posts from the space trash
    - delete:content:confluence # delete historical attachment versions (REST v1)
    # Permission checks for the signed-in user (REST v1)
    - read:confluence-user # /wiki/rest/api/user/current?expand=operations
    - read:confluence-space.summary # /wiki/rest/api/space/{key}?expand=operations
